<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>DNA fingerprint blood stain match</title>
  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DNA Fingerprint — Crime Scene Match</text>
  <rect x="60" y="40" width="360" height="170" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <!-- Lanes -->
  <text x="100" y="225" text-anchor="middle" font-size="10" fill="#333">Victim</text>
  <text x="180" y="225" text-anchor="middle" font-size="10" fill="#333">Suspect A</text>
  <text x="260" y="225" text-anchor="middle" font-size="10" fill="#333">Suspect B</text>
  <text x="340" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Blood stain</text>
  <!-- Shared band pattern for B and stain -->
  <rect x="92" y="70" width="16" height="4" fill="#555"/>
  <rect x="92" y="110" width="16" height="4" fill="#555"/>
  <rect x="92" y="150" width="16" height="4" fill="#555"/>
  <rect x="172" y="80" width="16" height="4" fill="#888"/>
  <rect x="172" y="120" width="16" height="4" fill="#888"/>
  <rect x="252" y="68" width="16" height="4" fill="#1565C0"/>
  <rect x="252" y="108" width="16" height="4" fill="#1565C0"/>
  <rect x="252" y="148" width="16" height="4" fill="#1565C0"/>
  <rect x="252" y="188" width="16" height="4" fill="#1565C0"/>
  <rect x="332" y="68" width="16" height="4" fill="#C62828"/>
  <rect x="332" y="108" width="16" height="4" fill="#C62828"/>
  <rect x="332" y="148" width="16" height="4" fill="#C62828"/>
  <rect x="332" y="188" width="16" height="4" fill="#C62828"/>
  <!-- Match brackets -->
  <path d="M 260 55 L 260 45 L 340 45 L 340 55" fill="none" stroke="#C62828" stroke-width="1.5"/>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#C62828">Match!</text>
  <text x="240" y="252" text-anchor="middle" font-size="10" fill="#555">Matching band pattern identifies the source</text>
</svg>
