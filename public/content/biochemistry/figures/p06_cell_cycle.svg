<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Phases of the cell cycle</title>
  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Phases of the Cell Cycle</text>
  <!-- Circle -->
  <circle cx="260" cy="210" r="140" fill="none" stroke="#90A4AE" stroke-width="3"/>
  <!-- Interphase A - large arc -->
  <path d="M 260 70 A 140 140 0 1 1 120 260" fill="none" stroke="#42A5F5" stroke-width="28" stroke-linecap="butt"/>
  <text x="180" y="130" font-size="12" font-weight="bold" fill="#1565C0">A  Interphase</text>
  <!-- Prophase D -->
  <path d="M 120 260 A 140 140 0 0 1 160 350" fill="none" stroke="#66BB6A" stroke-width="28"/>
  <text x="95" y="310" font-size="11" font-weight="bold" fill="#2E7D32">D  Prophase</text>
  <!-- Metaphase C -->
  <path d="M 160 350 A 140 140 0 0 1 260 350" fill="none" stroke="#FFA726" stroke-width="28"/>
  <text x="195" y="375" font-size="11" font-weight="bold" fill="#E65100">C  Metaphase</text>
  <!-- Anaphase E -->
  <path d="M 260 350 A 140 140 0 0 1 360 350" fill="none" stroke="#AB47BC" stroke-width="28"/>
  <text x="295" y="375" font-size="11" font-weight="bold" fill="#6A1B9A">E  Anaphase</text>
  <!-- Telophase B -->
  <path d="M 360 350 A 140 140 0 0 1 400 260" fill="none" stroke="#EF5350" stroke-width="28"/>
  <text x="380" y="310" font-size="11" font-weight="bold" fill="#C62828">B  Telophase</text>
  <!-- Cytokinesis -->
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#555">Cytokinesis</text>
  <text x="260" y="225" text-anchor="middle" font-size="10" fill="#777">(not shown on ring)</text>
  <!-- Legend -->
  <text x="260" y="395" text-anchor="middle" font-size="10" fill="#555">DNA replicates in Interphase before mitosis begins</text>
</svg>
