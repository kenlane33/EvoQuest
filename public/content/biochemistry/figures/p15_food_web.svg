<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Simple food web</title>
  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Food Web</text>
  <!-- Sun -->
  <circle cx="240" cy="45" r="18" fill="#FFEE58" stroke="#F9A825" stroke-width="1.5"/>
  <text x="240" y="50" text-anchor="middle" font-size="9" fill="#F57F17">Sun</text>
  <!-- Producers -->
  <ellipse cx="120" cy="120" rx="35" ry="20" fill="#66BB6A" stroke="#2E7D32"/>
  <text x="120" y="125" text-anchor="middle" font-size="9" fill="#fff">Grass</text>
  <ellipse cx="360" cy="120" rx="35" ry="20" fill="#66BB6A" stroke="#2E7D32"/>
  <text x="360" y="125" text-anchor="middle" font-size="9" fill="#fff">Algae</text>
  <!-- Primary consumers -->
  <circle cx="80" cy="200" r="18" fill="#42A5F5" stroke="#1565C0"/>
  <text x="80" y="204" text-anchor="middle" font-size="8" fill="#fff">Rabbit</text>
  <circle cx="200" cy="200" r="18" fill="#42A5F5" stroke="#1565C0"/>
  <text x="200" y="204" text-anchor="middle" font-size="8" fill="#fff">Snail</text>
  <circle cx="320" cy="200" r="18" fill="#42A5F5" stroke="#1565C0"/>
  <text x="320" y="204" text-anchor="middle" font-size="8" fill="#fff">Dragonfly</text>
  <!-- Secondary -->
  <circle cx="160" cy="260" r="20" fill="#FFA726" stroke="#E65100"/>
  <text x="160" y="264" text-anchor="middle" font-size="8" fill="#fff">Snake</text>
  <circle cx="280" cy="260" r="20" fill="#FFA726" stroke="#E65100"/>
  <text x="280" y="264" text-anchor="middle" font-size="8" fill="#fff">Frog</text>
  <!-- Tertiary -->
  <circle cx="240" cy="300" r="22" fill="#EF5350" stroke="#C62828"/>
  <text x="240" y="304" text-anchor="middle" font-size="9" fill="#fff">Hawk</text>
  <!-- Arrows -->
  <line x1="230" y1="60" x2="130" y2="100" stroke="#888" stroke-width="1" marker-end="url(#a)"/>
  <line x1="250" y1="60" x2="350" y2="100" stroke="#888" stroke-width="1"/>
  <line x1="110" y1="135" x2="85" y2="180" stroke="#888" stroke-width="1"/>
  <line x1="130" y1="135" x2="195" y2="180" stroke="#888" stroke-width="1"/>
  <line x1="350" y1="135" x2="315" y2="180" stroke="#888" stroke-width="1"/>
  <line x1="95" y1="215" x2="145" y2="245" stroke="#888" stroke-width="1"/>
  <line x1="210" y1="215" x2="170" y2="245" stroke="#888" stroke-width="1"/>
  <line x1="330" y1="215" x2="275" y2="245" stroke="#888" stroke-width="1"/>
  <line x1="175" y1="275" x2="225" y2="285" stroke="#888" stroke-width="1"/>
  <line x1="285" y1="275" x2="255" y2="285" stroke="#888" stroke-width="1"/>
  <defs><marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0,0 6,2.5 0,5" fill="#888"/></marker></defs>
  <text x="240" y="318" text-anchor="middle" font-size="9" fill="#555">Arrows show energy flow (who eats whom)</text>
</svg>
