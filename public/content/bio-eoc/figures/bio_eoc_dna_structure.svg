<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Labeled DNA molecule</title>
  <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">DNA Structure</text>
  <!-- Double helix simplified -->
  <path d="M 120 50 Q 160 80 120 110 Q 80 140 120 170 Q 160 200 120 230 Q 80 260 120 290" fill="none" stroke="#1565C0" stroke-width="3"/>
  <path d="M 280 50 Q 240 80 280 110 Q 320 140 280 170 Q 240 200 280 230 Q 320 260 280 290" fill="none" stroke="#C62828" stroke-width="3"/>
  <!-- Base pairs -->
  <line x1="130" y1="65" x2="270" y2="65" stroke="#555" stroke-width="1.5"/>
  <line x1="115" y1="95" x2="285" y2="95" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="125" x2="270" y2="125" stroke="#555" stroke-width="1.5"/>
  <line x1="115" y1="155" x2="285" y2="155" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="185" x2="270" y2="185" stroke="#555" stroke-width="1.5"/>
  <line x1="115" y1="215" x2="285" y2="215" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="245" x2="270" y2="245" stroke="#555" stroke-width="1.5"/>
  <line x1="115" y1="275" x2="285" y2="275" stroke="#555" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="95" y="55" font-size="16" fill="#1565C0">Sugar-phosphate</text>
  <text x="95" y="68" font-size="16" fill="#1565C0">backbone (52�32)</text>
  <text x="295" y="55" font-size="16" fill="#C62828">Backbone</text>
  <text x="200" y="170" text-anchor="middle" font-size="16" fill="#333">Nitrogenous bases</text>
  <text x="200" y="185" text-anchor="middle" font-size="16" fill="#555">(A-T, G-C pairs)</text>
  <text x="200" y="310" text-anchor="middle" font-size="16" fill="#555">Double helix — antiparallel strands</text>
</svg>
