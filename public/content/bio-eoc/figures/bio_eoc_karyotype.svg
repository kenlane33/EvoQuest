<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Karyotype showing trisomy 21</title>
  <text x="260" y="20" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Human Karyotype (47, XY — Trisomy 21)</text>
  <!-- Chromosome pairs simplified -->
  <g font-size="14" fill="#333">
    <!-- Row 1 pairs 1-6 -->
    <rect x="30" y="35" width="8" height="28" rx="2" fill="#EF5350"/><rect x="42" y="35" width="8" height="28" rx="2" fill="#EF5350"/>
    <rect x="70" y="38" width="7" height="24" rx="2" fill="#EC407A"/><rect x="82" y="38" width="7" height="24" rx="2" fill="#EC407A"/>
    <rect x="110" y="36" width="7" height="26" rx="2" fill="#AB47BC"/><rect x="122" y="36" width="7" height="26" rx="2" fill="#AB47BC"/>
    <rect x="150" y="37" width="6" height="25" rx="2" fill="#7E57C2"/><rect x="162" y="37" width="6" height="25" rx="2" fill="#7E57C2"/>
    <rect x="190" y="35" width="6" height="27" rx="2" fill="#5C6BC0"/><rect x="202" y="35" width="6" height="27" rx="2" fill="#5C6BC0"/>
    <rect x="230" y="36" width="6" height="26" rx="2" fill="#42A5F5"/><rect x="242" y="36" width="6" height="26" rx="2" fill="#42A5F5"/>
    <!-- Row 2 -->
    <rect x="30" y="75" width="6" height="24" rx="2" fill="#26C6DA"/><rect x="42" y="75" width="6" height="24" rx="2" fill="#26C6DA"/>
    <rect x="70" y="76" width="6" height="23" rx="2" fill="#26A69A"/><rect x="82" y="76" width="6" height="23" rx="2" fill="#26A69A"/>
    <rect x="110" y="77" width="5" height="22" rx="2" fill="#66BB6A"/><rect x="122" y="77" width="5" height="22" rx="2" fill="#66BB6A"/>
    <rect x="150" y="76" width="5" height="23" rx="2" fill="#9CCC65"/><rect x="162" y="76" width="5" height="23" rx="2" fill="#9CCC65"/>
    <rect x="190" y="77" width="5" height="22" rx="2" fill="#D4E157"/><rect x="202" y="77" width="5" height="22" rx="2" fill="#D4E157"/>
    <rect x="230" y="76" width="5" height="23" rx="2" fill="#FFEE58"/><rect x="242" y="76" width="5" height="23" rx="2" fill="#FFEE58"/>
    <!-- Trisomy 21 - three chromosomes -->
    <rect x="310" y="115" width="5" height="18" rx="2" fill="#FFA726"/>
    <rect x="320" y="115" width="5" height="18" rx="2" fill="#FFA726"/>
    <rect x="330" y="115" width="5" height="18" rx="2" fill="#FFA726"/>
    <text x="320" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">21 — 3 copies</text>
    <!-- Sex chromosomes XY -->
    <rect x="400" y="115" width="5" height="20" rx="2" fill="#78909C"/>
    <rect x="412" y="118" width="4" height="14" rx="2" fill="#78909C"/>
    <text x="408" y="145" text-anchor="middle" font-size="16" fill="#333">XY</text>
  </g>
  <text x="260" y="185" text-anchor="middle" font-size="16" fill="#555">Extra chromosome 21 � Down syndrome; XY � male</text>
</svg>
